<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-surface"><main class="min-h-screen flex items-center justify-center py-section-gap"><div class="flex flex-col w-full h-full justify-center items-center px-margin-x">
<div class="text-center mb-16 max-w-2xl mx-auto">
<h1 class="font-display-lg text-display-lg text-on-background mb-4">How will you use this platform?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select your primary role to customize your experience and ensure you get the most out of our tools.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl mx-auto">
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="account_type" type="radio" value="company"/>
<div class="absolute -inset-0.5 bg-gradient-to-r from-primary to-primary-container rounded-[32px] blur opacity-0 group-hover:opacity-30 transition duration-500 peer-checked:opacity-100"></div>
<div class="relative flex flex-col h-full bg-surface-container-lowest p-card-padding rounded-[24px] shadow-sm hover:shadow-xl hover:scale-[1.01] transition-all duration-300">
<div class="absolute top-8 right-8 text-surface-container-high peer-checked:text-primary transition-colors duration-300">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center mb-8 relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5"></div>
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 0, 'wght' 300;">business</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-4">Company</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-12 flex-grow">
          I'm looking to hire talent, manage projects, and streamline our workforce operations. Access enterprise tools and analytics.
        </p>
<div class="mt-auto">
<div class="h-px w-full bg-surface-container-highest mb-6"></div>
<ul class="space-y-4">
<li class="flex items-center text-on-surface">
<span class="material-symbols-outlined text-primary mr-3" style="font-size: 20px;">task_alt</span>
<span class="font-label-md text-label-md">Post opportunities & hire</span>
</li>
<li class="flex items-center text-on-surface">
<span class="material-symbols-outlined text-primary mr-3" style="font-size: 20px;">task_alt</span>
<span class="font-label-md text-label-md">Manage teams & payroll</span>
</li>
</ul>
</div>
</div>
</label>
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="account_type" type="radio" value="worker"/>
<div class="absolute -inset-0.5 bg-gradient-to-r from-tertiary to-tertiary-container rounded-[32px] blur opacity-0 group-hover:opacity-30 transition duration-500 peer-checked:opacity-100"></div>
<div class="relative flex flex-col h-full bg-surface-container-lowest p-card-padding rounded-[24px] shadow-sm hover:shadow-xl hover:scale-[1.01] transition-all duration-300">
<div class="absolute top-8 right-8 text-surface-container-high peer-checked:text-tertiary transition-colors duration-300">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center mb-8 relative overflow-hidden">
<div class="absolute inset-0 bg-tertiary/5"></div>
<span class="material-symbols-outlined text-tertiary text-4xl" style="font-variation-settings: 'FILL' 0, 'wght' 300;">person</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-4">Worker</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-12 flex-grow">
          I'm looking for work, managing my schedule, and tracking my earnings. Build your profile and connect with top companies.
        </p>
<div class="mt-auto">
<div class="h-px w-full bg-surface-container-highest mb-6"></div>
<ul class="space-y-4">
<li class="flex items-center text-on-surface">
<span class="material-symbols-outlined text-tertiary mr-3" style="font-size: 20px;">task_alt</span>
<span class="font-label-md text-label-md">Find flexible jobs</span>
</li>
<li class="flex items-center text-on-surface">
<span class="material-symbols-outlined text-tertiary mr-3" style="font-size: 20px;">task_alt</span>
<span class="font-label-md text-label-md">Track hours & payments</span>
</li>
</ul>
</div>
</div>
</label>
</div>
<div class="mt-16 text-center w-full max-w-sm mx-auto">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-14 rounded-full shadow-md hover:bg-surface-tint hover:shadow-lg transition-all duration-300 flex items-center justify-center group disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="continueBtn">
<span>Continue</span>
<span class="material-symbols-outlined ml-2 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="mt-6 font-body-md text-label-sm text-on-surface-variant">
        Already have an account? <a class="text-primary hover:underline font-label-md" href="#">Sign in</a>
</p>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const radioButtons = document.querySelectorAll('input[name="account_type"]');
    const continueBtn = document.getElementById('continueBtn');

    radioButtons.forEach(radio => {
      radio.addEventListener('change', () => {
        if (document.querySelector('input[name="account_type"]:checked')) {
          continueBtn.disabled = false;
        }
      });
    });
  });
</script></main></body></html>
